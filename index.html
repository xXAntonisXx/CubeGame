<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cube Topia Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f4f1ea; 
            font-family: sans-serif;
            user-select: none;
            touch-action: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #333;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
        }
        #restart-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            color: #333;
            border: 2px solid #ccc;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 40px;
            border-radius: 16px;
            color: #4ade80;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            display: none;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="score">Очки: 0</div>
    <button id="restart-btn">Заново</button>
    <div id="win-screen">Уровень пройден!</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const container = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        const winScreen = document.getElementById('win-screen');
        const restartBtn = document.getElementById('restart-btn');

        let scene, camera, renderer, cube;
        let arrows = [];
        let score = 0;
        
        const GRID_SIZE = 4; 
        const CUBE_SIZE = 3;
        const CELL_SIZE = CUBE_SIZE / GRID_SIZE; 

        function createArrowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, 128, 128);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(64, 110);
            ctx.lineTo(64, 40);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(64, 20);
            ctx.lineTo(30, 55);
            ctx.moveTo(64, 20);
            ctx.lineTo(98, 55);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        let arrowTexture;

        function init() {
            container.innerHTML = '';
            score = 0;
            scoreElement.innerText = `Очки: ${score}`;
            winScreen.style.display = 'none';
            arrows = [];

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf4f1ea);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(6, 6, 6); 
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            arrowTexture = createArrowTexture();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const geometry = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
            const material = new THREE.MeshStandardMaterial({ color: 0xffffff });
            cube = new THREE.Mesh(geometry, material);
            
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xdddddd }));
            cube.add(line);

            scene.add(cube);

            generateLevel();

            bindEvents();
            onWindowResize(); 
            animate();
        }

        function generateLevel() {
            const offset = CUBE_SIZE / 2 + 0.01; 
            const halfGrid = (GRID_SIZE - 1) / 2;

            for(let i = 0; i < GRID_SIZE; i++) {
                for(let j = 0; j < GRID_SIZE; j++) {
                    const posX = (i - halfGrid) * CELL_SIZE;
                    const posY = (j - halfGrid) * CELL_SIZE;
                    
                    if (Math.random() > 0.3) {
                        let dirs = [];
                        if (i > 0) dirs.push(3); 
                        if (i < GRID_SIZE - 1) dirs.push(1); 
                        if (j > 0) dirs.push(2); 
                        if (j < GRID_SIZE - 1) dirs.push(0); 
                        if (dirs.length > 0) createArrow(posX, offset, posY, 'top', dirs[Math.floor(Math.random() * dirs.length)], i, j);
                    }
                    
                    if (Math.random() > 0.3) {
                        let dirs = [];
                        if (i > 0) dirs.push(3); 
                        if (i < GRID_SIZE - 1) dirs.push(1); 
                        if (j > 0) dirs.push(2); 
                        if (j < GRID_SIZE - 1) dirs.push(0); 
                        if (dirs.length > 0) createArrow(posX, posY, offset, 'front', dirs[Math.floor(Math.random() * dirs.length)], i, j);
                    }
                    
                    if (Math.random() > 0.3) {
                        let dirs = [];
                        if (j > 0) dirs.push(2); 
                        if (j < GRID_SIZE - 1) dirs.push(0); 
                        if (i > 0) dirs.push(1); 
                        if (i < GRID_SIZE - 1) dirs.push(3); 
                        if (dirs.length > 0) createArrow(offset, posY, posX, 'right', dirs[Math.floor(Math.random() * dirs.length)], i, j);
                    }
                }
            }
        }

        // Теперь передаем индексы сетки i, j
        function createArrow(x, y, z, face, dirIndex, gridI, gridJ) {
            const geo = new THREE.PlaneGeometry(CELL_SIZE * 0.8, CELL_SIZE * 0.8);
            const mat = new THREE.MeshBasicMaterial({ 
                map: arrowTexture, 
                transparent: true,
                depthTest: false 
            });
            const mesh = new THREE.Mesh(geo, mat);

            mesh.position.set(x, y, z);
            
            let globalDir = new THREE.Vector3();
            let rotZ = 0;
            let baseRotX = 0;
            let baseRotY = 0;

            // Для стрелок направления трактуем так:
            // 0 - Вверх (по сетке), 1 - Вправо, 2 - Вниз, 3 - Влево
            if (face === 'top') {
                baseRotX = -Math.PI / 2;
                if (dirIndex === 0) { globalDir.set(0, 0, -1); rotZ = 0; }
                if (dirIndex === 1) { globalDir.set(1, 0, 0); rotZ = -Math.PI/2; }
                if (dirIndex === 2) { globalDir.set(0, 0, 1); rotZ = Math.PI; }
                if (dirIndex === 3) { globalDir.set(-1, 0, 0); rotZ = Math.PI/2; }
            } else if (face === 'front') {
                baseRotX = 0;
                if (dirIndex === 0) { globalDir.set(0, 1, 0); rotZ = 0; }
                if (dirIndex === 1) { globalDir.set(1, 0, 0); rotZ = -Math.PI/2; }
                if (dirIndex === 2) { globalDir.set(0, -1, 0); rotZ = Math.PI; }
                if (dirIndex === 3) { globalDir.set(-1, 0, 0); rotZ = Math.PI/2; }
            } else if (face === 'right') {
                baseRotY = Math.PI / 2;
                if (dirIndex === 0) { globalDir.set(0, 1, 0); rotZ = 0; }
                if (dirIndex === 1) { globalDir.set(0, 0, 1); rotZ = -Math.PI/2; }
                if (dirIndex === 2) { globalDir.set(0, -1, 0); rotZ = Math.PI; }
                if (dirIndex === 3) { globalDir.set(0, 0, -1); rotZ = Math.PI/2; }
            }

            mesh.rotation.set(baseRotX, baseRotY, rotZ);
            
            mesh.userData = { 
                isAnimating: false, 
                globalDir: globalDir, 
                dirIndex: dirIndex,
                face: face,
                startPos: new THREE.Vector3(x, y, z),
                gridI: gridI, // Сетка X (столбец)
                gridJ: gridJ  // Сетка Y (строка)
            };

            cube.add(mesh); 
            arrows.push(mesh);
        }

        function checkWin() {
            if (arrows.length === 0) {
                winScreen.style.display = 'block';
            }
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleTap(clientX, clientY) {
            if (arrows.length === 0) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(arrows, true); 

            if (intersects.length > 0) {
                let clickedArrow = intersects[0].object;
                if (clickedArrow.userData && !clickedArrow.userData.isAnimating) {
                    launchArrow(clickedArrow);
                }
            }
        }

        function launchArrow(arrow) {
            arrow.userData.isAnimating = true;
            const startPos = arrow.userData.startPos.clone();
            const dir = arrow.userData.globalDir.clone();
            const face = arrow.userData.face;
            const myI = arrow.userData.gridI;
            const myJ = arrow.userData.gridJ;
            const myDirIndex = arrow.userData.dirIndex;

            let closestObstacleDist = Infinity;
            let obstacleArrow = null;

            // 1. Ищем ближайшее препятствие, используя ТОЧНЫЕ координаты сетки
            for (let k = 0; k < arrows.length; k++) {
                const other = arrows[k];
                if (other === arrow || other.userData.face !== face) continue;

                const otherI = other.userData.gridI;
                const otherJ = other.userData.gridJ;

                let onSameLine = false;
                let distInGrid = 0;

                // Проверяем, смотрим ли мы в сторону другой стрелки и лежит ли она на одной линии
                if (myDirIndex === 0) { // Вверх
                    onSameLine = (myI === otherI && otherJ > myJ);
                    distInGrid = otherJ - myJ;
                } else if (myDirIndex === 1) { // Вправо
                    onSameLine = (myJ === otherJ && otherI > myI);
                    distInGrid = otherI - myI;
                } else if (myDirIndex === 2) { // Вниз
                    onSameLine = (myI === otherI && otherJ < myJ);
                    distInGrid = myJ - otherJ;
                } else if (myDirIndex === 3) { // Влево
                    onSameLine = (myJ === otherJ && otherI < myI);
                    distInGrid = myI - otherI;
                }

                if (onSameLine) {
                    const actualDist = distInGrid * CELL_SIZE;
                    if (actualDist < closestObstacleDist) {
                        closestObstacleDist = actualDist;
                        obstacleArrow = other;
                    }
                }
            }

            // 2. Вычисляем дистанцию до края куба
            const limit = CUBE_SIZE / 2;
            let distToEdge = Infinity;
            const epsilon = 0.001;

            if (dir.x > epsilon) distToEdge = Math.min(distToEdge, (limit - startPos.x) / dir.x);
            else if (dir.x < -epsilon) distToEdge = Math.min(distToEdge, (-limit - startPos.x) / dir.x);
            
            if (dir.y > epsilon) distToEdge = Math.min(distToEdge, (limit - startPos.y) / dir.y);
            else if (dir.y < -epsilon) distToEdge = Math.min(distToEdge, (-limit - startPos.y) / dir.y);
            
            if (dir.z > epsilon) distToEdge = Math.min(distToEdge, (limit - startPos.z) / dir.z);
            else if (dir.z < -epsilon) distToEdge = Math.min(distToEdge, (-limit - startPos.z) / dir.z);

            // 3. Проверяем столкновение
            const hitObstacle = obstacleArrow !== null && closestObstacleDist < distToEdge;

            if (hitObstacle) {
                // Отскок
                const animStart = performance.now();
                const bounceDist = Math.min(CELL_SIZE * 0.4, closestObstacleDist * 0.8);

                function animateReturn() {
                    const t = (performance.now() - animStart) / 150; 
                    if (t < 1) {
                        arrow.position.copy(startPos).add(dir.clone().multiplyScalar(bounceDist * t));
                        requestAnimationFrame(animateReturn);
                    } else {
                        const tBack = (performance.now() - animStart - 150) / 150; 
                        if (tBack < 1) {
                            arrow.position.copy(startPos).add(dir.clone().multiplyScalar(bounceDist * (1 - tBack)));
                            requestAnimationFrame(animateReturn);
                        } else {
                            arrow.position.copy(startPos);
                            arrow.userData.isAnimating = false; 
                        }
                    }
                }
                animateReturn();
            } else {
                // Успешный вылет
                const animStart = performance.now();
                function animateFly() {
                    const t = (performance.now() - animStart) / 200; 
                    if (t < 1) {
                        const flyDist = Math.min(distToEdge, CUBE_SIZE * 1.5);
                        arrow.position.copy(startPos).add(dir.clone().multiplyScalar(t * flyDist));
                        arrow.material.opacity = 1 - t;
                        requestAnimationFrame(animateFly);
                    } else {
                        const index = arrows.indexOf(arrow);
                        if (index > -1) {
                            cube.remove(arrow);
                            arrows.splice(index, 1);
                            score += 10;
                            scoreElement.innerText = `Очки: ${score}`;
                            checkWin();
                        }
                    }
                }
                animateFly();
            }
        }

        // --- Управление ---
        let isDragging = false;
        let startX = 0, startY = 0;
        let previousMousePosition = { x: 0, y: 0 };
        let dragDistance = 0; 

        function onPointerDown(e) {
            isDragging = true;
            dragDistance = 0;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const deltaMove = {
                x: clientX - previousMousePosition.x,
                y: clientY - previousMousePosition.y
            };
            dragDistance += Math.abs(deltaMove.x) + Math.abs(deltaMove.y);
            cube.rotation.y += deltaMove.x * 0.01;
            cube.rotation.x += deltaMove.y * 0.01;
            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            if (dragDistance < 15) {
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                handleTap(clientX, clientY);
            }
        }

        function bindEvents() {
            renderer.domElement.addEventListener('mousedown', onPointerDown);
            renderer.domElement.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });
            renderer.domElement.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);
        }

        function onWindowResize() {
            if(!container || !camera || !renderer) return;
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', onWindowResize);

        function animate() {
            requestAnimationFrame(animate);
            if(renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        restartBtn.addEventListener('click', () => {
            init();
        });

        init();
    </script>
</body>
</html>
