<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cube Topia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const container = document.getElementById('game-container');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 6, 6); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        function createGridTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a4b8d'; 
            ctx.fillRect(0, 0, size, size);
            ctx.strokeStyle = '#4a86ff'; 
            ctx.lineWidth = 6;
            const step = size / 3;
            for (let i = 1; i < 3; i++) {
                ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, size); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * step); ctx.lineTo(size, i * step); ctx.stroke();
            }
            ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        const CUBE_SIZE = 3; 
        const geometry = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
        const material = new THREE.MeshStandardMaterial({ map: createGridTexture() });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // --- ИГРОВАЯ ЛОГИКА ---
        const CELL_SIZE = CUBE_SIZE / 3; 
        const offset = CUBE_SIZE / 2 + 0.01; 
        const arrows = []; 

        function createArrow(x, y, z, face, dirIndex) {
            const arrowGroup = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.2; 
            arrowGroup.add(body);

            const headGeo = new THREE.ConeGeometry(0.2, 0.3, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xff4444 }); 
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 0.5; 
            arrowGroup.add(head);

            arrowGroup.position.set(x, y, z);
            
            let dir = new THREE.Vector3();
            let rotZ = 0;

            if (face === 'top') {
                arrowGroup.rotation.x = 0;
                if (dirIndex === 0) { dir.set(0, 0, -1); rotZ = 0; }
                if (dirIndex === 1) { dir.set(1, 0, 0); rotZ = -Math.PI/2; }
                if (dirIndex === 2) { dir.set(0, 0, 1); rotZ = Math.PI; }
                if (dirIndex === 3) { dir.set(-1, 0, 0); rotZ = Math.PI/2; }
            } else if (face === 'front') {
                arrowGroup.rotation.x = Math.PI / 2;
                if (dirIndex === 0) { dir.set(0, 1, 0); rotZ = 0; }
                if (dirIndex === 1) { dir.set(1, 0, 0); rotZ = -Math.PI/2; }
                if (dirIndex === 2) { dir.set(0, -1, 0); rotZ = Math.PI; }
                if (dirIndex === 3) { dir.set(-1, 0, 0); rotZ = Math.PI/2; }
            } else if (face === 'right') {
                arrowGroup.rotation.z = -Math.PI / 2;
                if (dirIndex === 0) { dir.set(0, 1, 0); rotZ = 0; }
                if (dirIndex === 1) { dir.set(0, 0, 1); rotZ = -Math.PI/2; }
                if (dirIndex === 2) { dir.set(0, -1, 0); rotZ = Math.PI; }
                if (dirIndex === 3) { dir.set(0, 0, -1); rotZ = Math.PI/2; }
            }

            arrowGroup.rotation.z = rotZ;
            arrowGroup.userData = { isAnimating: false, dir: dir, face: face };

            cube.add(arrowGroup); 
            arrows.push(arrowGroup);
        }

        // Генерация уровня
        for(let i = -1; i <= 1; i++) {
            for(let j = -1; j <= 1; j++) {
                if (Math.random() > 0.2) createArrow(i * CELL_SIZE, offset, j * CELL_SIZE, 'top', Math.floor(Math.random() * 4));
                if (Math.random() > 0.2) createArrow(i * CELL_SIZE, j * CELL_SIZE, offset, 'front', Math.floor(Math.random() * 4));
                if (Math.random() > 0.2) createArrow(offset, j * CELL_SIZE, i * CELL_SIZE, 'right', Math.floor(Math.random() * 4));
            }
        }

        // --- КЛИКИ И ВЫСТРЕЛЫ ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleTap(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(arrows, true); 

            if (intersects.length > 0) {
                let clickedArrow = intersects[0].object;
                while (clickedArrow.parent !== cube && clickedArrow.parent !== null) {
                    clickedArrow = clickedArrow.parent;
                }

                if (clickedArrow.userData && !clickedArrow.userData.isAnimating) {
                    launchArrow(clickedArrow);
                }
            }
        }

        function launchArrow(arrow) {
            arrow.userData.isAnimating = true;
            const startTime = Date.now();
            const startPos = arrow.position.clone();
            const dir = arrow.userData.dir.clone(); 
            
            function animateArrow() {
                const timePassed = (Date.now() - startTime) / 1000;
                
                arrow.position.copy(startPos).add(dir.clone().multiplyScalar(timePassed * 6));
                
                let hit = false;
                for (let i = arrows.length - 1; i >= 0; i--) {
                    const other = arrows[i];
                    if (other === arrow || other.userData.isAnimating) continue;
                    if (other.userData.face !== arrow.userData.face) continue; 

                    if (arrow.position.distanceTo(other.position) < 0.6) {
                        cube.remove(other);
                        arrows.splice(i, 1);
                        hit = true;
                    }
                }

                if (hit) {
                    arrow.scale.setScalar(Math.max(0, 1 - timePassed * 2));
                } else {
                    arrow.scale.setScalar(Math.max(0, 1 - timePassed));
                }

                if (timePassed < 1.5) {
                    requestAnimationFrame(animateArrow);
                } else {
                    cube.remove(arrow);
                    const index = arrows.indexOf(arrow);
                    if (index > -1) arrows.splice(index, 1);
                }
            }
            animateArrow();
        }

        // --- УПРАВЛЕНИЕ ---
        let isDragging = false;
        let startX = 0, startY = 0;
        let previousMousePosition = { x: 0, y: 0 };
        let dragDistance = 0; 

        function onPointerDown(e) {
            isDragging = true;
            dragDistance = 0;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const deltaMove = {
                x: clientX - previousMousePosition.x,
                y: clientY - previousMousePosition.y
            };
            dragDistance += Math.abs(deltaMove.x) + Math.abs(deltaMove.y);
            cube.rotation.y += deltaMove.x * 0.01;
            cube.rotation.x += deltaMove.y * 0.01;
            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            if (dragDistance < 15) {
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                handleTap(clientX, clientY);
            }
        }

        renderer.domElement.addEventListener('mousedown', onPointerDown);
        renderer.domElement.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });
        renderer.domElement.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        function onWindowResize() {
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', onWindowResize);
        onWindowResize(); 

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
