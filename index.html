<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Casino Slot Machine</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            touch-action: none;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .machine {
            background: linear-gradient(145deg, #2a2a40, #161626);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.5),
                inset 0 2px 5px rgba(255,255,255,0.1),
                inset 0 -5px 15px rgba(0,0,0,0.5);
            border: 4px solid #ffd700;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
        }

        /* Экран с барабанами */
        .screen {
            background-color: #eee;
            padding: 0;
            border-radius: 10px;
            display: flex;
            gap: 5px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            border: 3px solid #555;
            overflow: hidden;
            position: relative;
            height: 110px;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(255,255,255,0) 20%, rgba(255,255,255,0) 80%, rgba(0,0,0,0.3) 100%);
        }

        /* Контейнер для вращения */
        .reel-window {
            width: 80px;
            height: 100px;
            background-color: #fff;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            border: 1px solid #ccc;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
            margin: 5px 0;
        }

        /* Лента с символами */
        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform; /* Оптимизация для анимации */
        }

        .symbol {
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            line-height: 1;
        }

        /* Рычаг */
        .lever-container {
            position: relative;
            width: 60px;
            height: 180px;
            display: flex;
            justify-content: center;
            cursor: pointer;
        }

        .lever-base {
            width: 20px;
            height: 100%;
            background: linear-gradient(to right, #555, #888, #555);
            border-radius: 10px;
            position: absolute;
            bottom: 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .lever-arm {
            width: 15px;
            height: 80px;
            background: linear-gradient(to right, #999, #ccc, #999);
            position: absolute;
            bottom: 50px;
            border-radius: 8px;
            transform-origin: bottom center;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5px;
        }

        .lever-arm.pulled {
            transform: rotateX(50deg);
        }

        .lever-knob {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
            border-radius: 50%;
            position: absolute;
            top: -30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset -2px -2px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        .lever-container:active .lever-knob {
            transform: scale(0.9);
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }

        /* Интерфейс */
        .ui-panel {
            margin-top: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .message {
            font-size: 20px;
            height: 30px;
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .bet-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .bet-btn {
            background: #333;
            color: white;
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 8px 15px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .bet-btn:active { background: #555; }
        .bet-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .bet-display {
            font-size: 18px;
            color: #ddd;
        }

        .bet-display span {
            color: #ffd700;
            font-weight: bold;
            font-size: 22px;
        }

        .win-effect {
            animation: flash 0.5s ease-in-out infinite alternate;
        }

        @keyframes flash {
            from { box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 20px #4ade80; }
            to { box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 50px #4ade80; }
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="game-container">
        <div class="machine">
            <div class="screen" id="screen">
                <!-- Контейнеры для барабанов -->
                <div class="reel-window"><div class="reel-strip" id="strip1"></div></div>
                <div class="reel-window"><div class="reel-strip" id="strip2"></div></div>
                <div class="reel-window"><div class="reel-strip" id="strip3"></div></div>
            </div>
            
            <div class="lever-container" id="lever" onclick="spin()">
                <div class="lever-base"></div>
                <div class="lever-arm" id="leverArm">
                    <div class="lever-knob"></div>
                </div>
            </div>
        </div>

        <div class="ui-panel">
            <div class="balance">Баланс: <span id="balance">1000</span> 💰</div>
            <div class="message" id="message">Дерните рычаг!</div>
            
            <div class="bet-controls">
                <button class="bet-btn" id="betMinus" onclick="changeBet(-50)">-50</button>
                <div class="bet-display">Ставка: <span id="bet">100</span></div>
                <button class="bet-btn" id="betPlus" onclick="changeBet(50)">+50</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- ЗВУКОВЫЕ ЭФФЕКТЫ (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(frequency, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            // Плавное затухание
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playClick() { playSound(800, 'square', 0.05); }
        function playStop() { playSound(400, 'triangle', 0.1); }
        function playWin() { 
            playSound(600, 'sine', 0.2); 
            setTimeout(() => playSound(800, 'sine', 0.3), 100);
            setTimeout(() => playSound(1200, 'sine', 0.4), 250);
        }

        // --- ЛОГИКА ИГРЫ ---
        const SYMBOLS = ['🍒', '🍋', '🍊', '🍇', '🔔', '💎', '7️⃣'];
        
        let balance = 1000;
        let currentBet = 100;
        let isSpinning = false;

        const balanceEl = document.getElementById('balance');
        const betEl = document.getElementById('bet');
        const messageEl = document.getElementById('message');
        const leverArm = document.getElementById('leverArm');
        const screenEl = document.getElementById('screen');
        const betMinus = document.getElementById('betMinus');
        const betPlus = document.getElementById('betPlus');

        const strips = [
            document.getElementById('strip1'),
            document.getElementById('strip2'),
            document.getElementById('strip3')
        ];

        // Заполняем ленты символами (создаем длинные ленты для прокрутки)
        const STRIP_LENGTH = 30;
        function initStrips() {
            strips.forEach(strip => {
                strip.innerHTML = '';
                for (let i = 0; i < STRIP_LENGTH; i++) {
                    const div = document.createElement('div');
                    div.className = 'symbol';
                    div.innerText = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                    strip.appendChild(div);
                }
            });
        }

        function changeBet(amount) {
            if (isSpinning) return;
            let newBet = currentBet + amount;
            if (newBet < 10) newBet = 10;
            if (newBet > balance) newBet = balance;
            currentBet = newBet;
            betEl.innerText = currentBet;
            playClick();
        }

        // Анимация прокрутки одного барабана
        function animateReel(stripElement, targetSymbol, duration, delay, callback) {
            const symbolHeight = 100; // Высота одного символа в CSS
            const totalSymbols = STRIP_LENGTH;
            
            // Находим случайную позицию для целевого символа
            const targetIndex = Math.floor(Math.random() * (totalSymbols - 10)) + 5; // Берем с запасом, чтобы не было пустоты в конце
            
            // Расставляем символы так, чтобы на позиции targetIndex был нужный
            const symbols = stripElement.children;
            for (let i = 0; i < totalSymbols; i++) {
                if (i === targetIndex) {
                    symbols[i].innerText = targetSymbol;
                } else if (!symbols[i].innerText) {
                    symbols[i].innerText = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                }
            }

            // Итоговое смещение: прокручиваем так, чтобы targetIndex оказался на экране
            const finalTranslate = -(targetIndex * symbolHeight);
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                let progress = Math.min(elapsed / duration, 1);
                
                // Easing функция (замедление к концу, cubic out)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                // Текущее смещение
                let currentTranslate = finalTranslate * easeOut;
                
                // Добавляем размытие движения
                const speed = (finalTranslate - currentTranslate) / 10;
                const blurAmount = Math.min(Math.abs(speed), 5);
                
                stripElement.style.transform = `translateY(${currentTranslate}px)`;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    stripElement.style.transform = `translateY(${finalTranslate}px)`;
                    playStop();
                    if (callback) callback();
                }
            }
            
            // Задержка перед началом
            setTimeout(() => {
                requestAnimationFrame(update);
            }, delay);
        }

        function spin() {
            if (isSpinning) return;
            if (balance < currentBet) {
                messageEl.innerText = "Недостаточно средств!";
                messageEl.style.color = "#ff4444";
                return;
            }

            // Инициализируем контекст аудио после клика (требование браузеров)
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isSpinning = true;
            balance -= currentBet;
            balanceEl.innerText = balance;
            messageEl.innerText = "Крутим...";
            messageEl.style.color = "#fff";
            screenEl.classList.remove('win-effect');
            
            betMinus.disabled = true;
            betPlus.disabled = true;

            leverArm.classList.add('pulled');
            setTimeout(() => leverArm.classList.remove('pulled'), 300);

            // Предварительно генерируем результат
            const results = [
                SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
                SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
                SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]
            ];

            // Запускаем анимацию всех трех барабанов с разной длительностью
            initStrips(); // Обновляем ленты
            
            // Барабан 1 останавливается через 2 сек
            animateReel(strips[0], results[0], 2000, 0, () => {});
            
            // Барабан 2 останавливается через 2.5 сек
            animateReel(strips[1], results[1], 2500, 200, () => {});
            
            // Барабан 3 останавливается через 3 сек
            animateReel(strips[2], results[2], 3000, 400, () => {
                checkWin(results);
            });
        }

        function checkWin(results) {
            let winAmount = 0;
            let winMessage = "";

            if (results[0] === results[1] && results[1] === results[2]) {
                if (results[0] === '7️⃣') {
                    winAmount = currentBet * 50;
                    winMessage = "🎉 ДЖЕКПОТ! x50 🎉";
                } else if (results[0] === '💎') {
                    winAmount = currentBet * 20;
                    winMessage = "💎 БРИЛЛИАНТЫ! x20 💎";
                } else {
                    winAmount = currentBet * 10;
                    winMessage = `🔥 Три ${results[0]}! x10 🔥`;
                }
            } 
            else if (results[0] === results[1] || results[1] === results[2] || results[0] === results[2]) {
                winAmount = currentBet * 2;
                winMessage = "✨ Два в ряд! x2 ✨";
            }

            if (winAmount > 0) {
                balance += winAmount;
                balanceEl.innerText = balance;
                messageEl.innerText = winMessage;
                messageEl.style.color = "#4ade80";
                screenEl.classList.add('win-effect');
                playWin();
            } else {
                messageEl.innerText = "Повезет в следующий раз!";
                messageEl.style.color = "#ff4444";
            }

            isSpinning = false;
            betMinus.disabled = false;
            betPlus.disabled = false;
            
            if (currentBet > balance) {
                currentBet = balance >= 10 ? balance : 10;
                betEl.innerText = currentBet;
            }
        }

        // Инициализация при старте
        initStrips();
        betEl.innerText = currentBet;
        balanceEl.innerText = balance;
    </script>
</body>
</html>
