<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>3D Крестики-Нолики</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e; 
            font-family: sans-serif;
            user-select: none;
            touch-action: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        #status {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        #restart-btn {
            background: #4a86ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #restart-btn:active {
            background: #2a4b8d;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-layer">
        <div id="status">Ваш ход (Крестики)</div>
        <button id="restart-btn">Заново</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const container = document.getElementById('game-container');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restart-btn');

        let scene, camera, renderer, cube;
        let cells = []; // Массив для хранения мешей клеток
        let boardState = {}; // Состояние игры

        const GRID_SIZE = 3; // 3x3
        const CUBE_SIZE = 3;
        const CELL_SIZE = CUBE_SIZE / GRID_SIZE; 

        // Состояние для каждой грани (пустая строка)
        const faces = ['top', 'front', 'right'];
        faces.forEach(f => boardState[f] = Array(9).fill(null));

        let isPlayerTurn = true;

        function init() {
            container.innerHTML = '';
            faces.forEach(f => boardState[f] = Array(9).fill(null));
            cells = [];
            isPlayerTurn = true;
            statusText.innerText = "Ваш ход (Крестики)";
            statusText.style.color = "white";

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Фиксированная камера, чтобы видеть 3 грани
            camera.position.set(6, 6, 6); 
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Свет
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // Сам куб (темный фон)
            const geometry = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
            const material = new THREE.MeshStandardMaterial({ color: 0x2a4b8d });
            cube = new THREE.Mesh(geometry, material);
            
            // Линии сетки на кубе
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x4a86ff }));
            cube.add(line);

            scene.add(cube);

            // Создаем невидимые (или полупрозрачные) кликабельные зоны
            createInteractiveCells();

            bindEvents();
            onWindowResize(); 
            animate();
        }

        function createInteractiveCells() {
            const offset = CUBE_SIZE / 2 + 0.01; 
            const halfGrid = (GRID_SIZE - 1) / 2;

            faces.forEach(face => {
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        const posX = (i - halfGrid) * CELL_SIZE;
                        const posY = (j - halfGrid) * CELL_SIZE;
                        
                        // Создаем плоский квадрат для клика
                        const geo = new THREE.PlaneGeometry(CELL_SIZE * 0.9, CELL_SIZE * 0.9);
                        const mat = new THREE.MeshBasicMaterial({ 
                            color: 0xffffff, 
                            transparent: true, 
                            opacity: 0.05, // Едва заметный
                            side: THREE.DoubleSide
                        });
                        const mesh = new THREE.Mesh(geo, mat);

                        // Позиционируем и разворачиваем
                        if (face === 'top') {
                            mesh.position.set(posX, offset, posY);
                            mesh.rotation.x = -Math.PI / 2;
                        } else if (face === 'front') {
                            mesh.position.set(posX, posY, offset);
                        } else if (face === 'right') {
                            mesh.position.set(offset, posY, posX);
                            mesh.rotation.y = Math.PI / 2;
                        }

                        mesh.userData = {
                            face: face,
                            index: i * GRID_SIZE + j,
                            isOccupied: false,
                            markMesh: null
                        };

                        cube.add(mesh);
                        cells.push(mesh);
                    }
                }
            });
        }

        // Отрисовка Крестика или Нолика
        function drawMark(cell, isCross) {
            const markGroup = new THREE.Group();
            const color = isCross ? 0xff4444 : 0x44ff44; // Красный для X, Зеленый для O
            const size = CELL_SIZE * 0.6;

            if (isCross) {
                // Крестик (две линии)
                const geo1 = new THREE.BoxGeometry(size, 0.05, 0.05);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                const line1 = new THREE.Mesh(geo1, mat);
                line1.rotation.z = Math.PI / 4;
                
                const line2 = new THREE.Mesh(geo1, mat);
                line2.rotation.z = -Math.PI / 4;

                markGroup.add(line1);
                markGroup.add(line2);
            } else {
                // Нолик (кольцо)
                const geo = new THREE.RingGeometry(size * 0.3, size * 0.5, 16);
                const mat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });
                const ring = new THREE.Mesh(geo, mat);
                markGroup.add(ring);
            }

            // Привязываем маркер к позиции клетки и ее повороту
            markGroup.position.copy(cell.position);
            markGroup.rotation.copy(cell.rotation);
            // Чуть выдвигаем вперед, чтобы не сливалось с кубом
            markGroup.translateZ(0.01); 

            cube.add(markGroup);
            cell.userData.markMesh = markGroup;
        }

        // Проверка победы на одной грани
        function checkWin(face) {
            const state = boardState[face];
            const winLines = [
                [0,1,2], [3,4,5], [6,7,8], // Горизонтали
                [0,3,6], [1,4,7], [2,5,8], // Вертикали
                [0,4,8], [2,4,6]           // Диагонали
            ];

            for (let line of winLines) {
                const [a, b, c] = line;
                if (state[a] && state[a] === state[b] && state[a] === state[c]) {
                    return state[a]; // 'X' или 'O'
                }
            }
            return null;
        }

        // Ход бота (простейший ИИ)
        function botMove() {
            // Ищем свободные клетки
            const freeCells = cells.filter(c => !c.userData.isOccupied);
            if (freeCells.length === 0) return;

            // Для простоты бот ставит в случайную свободную клетку
            // (В идеале тут можно написать умный ИИ, но для теста сойдет)
            const randomCell = freeCells[Math.floor(Math.random() * freeCells.length)];
            
            randomCell.userData.isOccupied = true;
            const face = randomCell.userData.face;
            const idx = randomCell.userData.index;
            
            boardState[face][idx] = 'O';
            drawMark(randomCell, false);

            const winner = checkWin(face);
            if (winner) {
                statusText.innerText = "Победил Бот (Нолики)!";
                statusText.style.color = "#44ff44";
            } else {
                isPlayerTurn = true;
                statusText.innerText = "Ваш ход (Крестики)";
            }
        }

        // Обработка клика
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleTap(clientX, clientY) {
            if (!isPlayerTurn) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cells); 

            if (intersects.length > 0) {
                const clickedCell = intersects[0].object;
                
                if (!clickedCell.userData.isOccupied) {
                    clickedCell.userData.isOccupied = true;
                    const face = clickedCell.userData.face;
                    const idx = clickedCell.userData.index;
                    
                    boardState[face][idx] = 'X';
                    drawMark(clickedCell, true);

                    const winner = checkWin(face);
                    if (winner) {
                        statusText.innerText = "Вы победили (Крестики)!";
                        statusText.style.color = "#ff4444";
                        isPlayerTurn = false;
                    } else {
                        isPlayerTurn = false;
                        statusText.innerText = "Ход бота...";
                        setTimeout(botMove, 500); // Задержка для реалистичности
                    }
                }
            }
        }

        // --- Управление кликами ---
        let isDragging = false;
        let startX = 0, startY = 0;
        let dragDistance = 0; 

        function onPointerDown(e) {
            isDragging = true;
            dragDistance = 0;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragDistance += Math.abs(clientX - startX) + Math.abs(clientY - startY);
            startX = clientX;
            startY = clientY;
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            // Если сдвинули мало — это клик
            if (dragDistance < 15) {
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                handleTap(clientX, clientY);
            }
        }

        function bindEvents() {
            renderer.domElement.addEventListener('mousedown', onPointerDown);
            renderer.domElement.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });
            renderer.domElement.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);
        }

        function onWindowResize() {
            if(!container || !camera || !renderer) return;
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', onWindowResize);

        function animate() {
            requestAnimationFrame(animate);
            if(renderer && scene && camera) renderer.render(scene, camera);
        }

        restartBtn.addEventListener('click', () => init());
        init();
    </script>
</body>
</html>
