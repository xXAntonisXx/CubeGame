<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Casino Slot Machine</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Корпус автомата */
        .machine {
            background: linear-gradient(145deg, #2a2a40, #161626);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.5),
                inset 0 2px 5px rgba(255,255,255,0.1),
                inset 0 -5px 15px rgba(0,0,0,0.5);
            border: 4px solid #ffd700;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
        }

        /* Экран с барабанами */
        .screen {
            background-color: #fff;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            border: 3px solid #555;
        }

        .reel {
            width: 80px;
            height: 100px;
            background-color: #eee;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            overflow: hidden;
            position: relative;
            border: 1px solid #ccc;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.1);
        }

        .reel-spinning {
            animation: spin 0.1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translateY(-10px); opacity: 0.8; }
            50% { transform: translateY(10px); opacity: 1; }
            100% { transform: translateY(-10px); opacity: 0.8; }
        }

        /* Рычаг */
        .lever-container {
            position: relative;
            width: 40px;
            height: 150px;
            display: flex;
            justify-content: center;
        }

        .lever-base {
            width: 20px;
            height: 100%;
            background: linear-gradient(to right, #555, #888, #555);
            border-radius: 10px;
            position: absolute;
            bottom: 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .lever-arm {
            width: 15px;
            height: 80px;
            background: linear-gradient(to right, #999, #ccc, #999);
            position: absolute;
            bottom: 50px;
            border-radius: 8px;
            cursor: pointer;
            transform-origin: bottom center;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5px;
        }

        .lever-arm:active, .lever-arm.pulled {
            transform: rotateX(45deg);
        }

        .lever-knob {
            width: 35px;
            height: 35px;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
            border-radius: 50%;
            position: absolute;
            top: -25px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        /* Интерфейс */
        .ui-panel {
            margin-top: 20px;
            text-align: center;
        }

        .balance {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .message {
            font-size: 20px;
            height: 25px;
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .bet-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .bet-btn {
            background: #333;
            color: white;
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 5px 15px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .bet-btn:active { background: #555; }

        .spin-btn {
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            transition: 0.2s;
            text-transform: uppercase;
        }

        .spin-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(255, 215, 0, 0.4);
        }

        .spin-btn:disabled {
            background: #666;
            color: #aaa;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Эффект выигрыша */
        .win-effect {
            animation: flash 0.5s ease-in-out infinite alternate;
        }

        @keyframes flash {
            from { box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 20px #4ade80; }
            to { box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 40px #4ade80; }
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="game-container">
        <div class="machine">
            <div class="screen" id="screen">
                <div class="reel" id="reel1">🍒</div>
                <div class="reel" id="reel2">🍒</div>
                <div class="reel" id="reel3">🍒</div>
            </div>
            
            <div class="lever-container">
                <div class="lever-base"></div>
                <div class="lever-arm" id="lever">
                    <div class="lever-knob"></div>
                </div>
            </div>
        </div>

        <div class="ui-panel">
            <div class="balance">Баланс: <span id="balance">1000</span> 💰</div>
            <div class="message" id="message">Дерните рычаг!</div>
            
            <div class="bet-controls">
                <button class="bet-btn" onclick="changeBet(-50)">-50</button>
                <div>Ставка: <span id="bet">100</span></div>
                <button class="bet-btn" onclick="changeBet(50)">+50</button>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spin()">Крутить</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Конфигурация игры
        const SYMBOLS = ['🍒', '🍋', '🍊', '🍇', '🔔', '💎', '7️⃣'];
        
        // Состояние игры
        let balance = 1000;
        let currentBet = 100;
        let isSpinning = false;

        // DOM элементы
        const reels = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];
        const balanceEl = document.getElementById('balance');
        const betEl = document.getElementById('bet');
        const messageEl = document.getElementById('message');
        const spinBtn = document.getElementById('spinBtn');
        const lever = document.getElementById('lever');
        const screenEl = document.getElementById('screen');

        // Функция изменения ставки
        function changeBet(amount) {
            if (isSpinning) return;
            let newBet = currentBet + amount;
            if (newBet < 10) newBet = 10;
            if (newBet > balance) newBet = balance;
            currentBet = newBet;
            betEl.innerText = currentBet;
        }

        // Функция вращения
        function spin() {
            if (isSpinning) return;
            if (balance < currentBet) {
                messageEl.innerText = "Недостаточно средств!";
                messageEl.style.color = "#ff4444";
                return;
            }

            // Блокируем интерфейс
            isSpinning = true;
            spinBtn.disabled = true;
            balance -= currentBet;
            balanceEl.innerText = balance;
            messageEl.innerText = "Крутим...";
            messageEl.style.color = "#fff";
            screenEl.classList.remove('win-effect');

            // Анимация рычага
            lever.classList.add('pulled');
            setTimeout(() => lever.classList.remove('pulled'), 200);

            // Запускаем анимацию барабанов
            reels.forEach(reel => {
                reel.classList.add('reel-spinning');
            });

            // Генерируем результаты
            const results = [
                SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
                SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
                SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]
            ];

            // Останавливаем барабаны по очереди
            setTimeout(() => {
                reels[0].classList.remove('reel-spinning');
                reels[0].innerText = results[0];
            }, 1000);

            setTimeout(() => {
                reels[1].classList.remove('reel-spinning');
                reels[1].innerText = results[1];
            }, 1500);

            setTimeout(() => {
                reels[2].classList.remove('reel-spinning');
                reels[2].innerText = results[2];
                
                // Проверяем результат после остановки последнего барабана
                checkWin(results);
            }, 2000);
        }

        // Проверка выигрыша
        function checkWin(results) {
            let winAmount = 0;
            let winMessage = "";

            // Все три совпадают
            if (results[0] === results[1] && results[1] === results[2]) {
                if (results[0] === '7️⃣') {
                    winAmount = currentBet * 50; // Джекпот!
                    winMessage = "🎉 ДЖЕКПОТ! x50 🎉";
                } else if (results[0] === '💎') {
                    winAmount = currentBet * 20;
                    winMessage = "💎 БРИЛЛИАНТЫ! x20 💎";
                } else {
                    winAmount = currentBet * 10;
                    winMessage = `🔥 Три ${results[0]}! x10 🔥`;
                }
            } 
            // Два совпадают
            else if (results[0] === results[1] || results[1] === results[2] || results[0] === results[2]) {
                winAmount = currentBet * 2;
                winMessage = "✨ Два в ряд! x2 ✨";
            }

            if (winAmount > 0) {
                balance += winAmount;
                balanceEl.innerText = balance;
                messageEl.innerText = winMessage;
                messageEl.style.color = "#4ade80";
                screenEl.classList.add('win-effect');
            } else {
                messageEl.innerText = "Повезет в следующий раз!";
                messageEl.style.color = "#ff4444";
            }

            // Разблокируем интерфейс
            isSpinning = false;
            spinBtn.disabled = false;
            
            // Корректируем ставку, если баланс упал
            if (currentBet > balance) {
                currentBet = balance > 0 ? balance : 10;
                betEl.innerText = currentBet;
            }
        }

        // Инициализация
        betEl.innerText = currentBet;
        balanceEl.innerText = balance;
    </script>
</body>
</html>
